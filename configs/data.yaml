# AI4Arctic data configuration.
#
# The variable names below are VERIFIED on a real scene
# (20201016T082722_dmi_prep.nc) with `make inspect`, and cross-checked against
# utils.py in the official toolkit astokholm/AI4ArcticSeaIceChallenge.
# They are not copied from the original design notes: those gave them as
# indicative, and in fact two of them differ (see `geometry` below).
#
# Rule: if a name changes, update THIS file, not the code.
#
# The frozen split lives in configs/split.yaml, which is GENERATED. This file is
# written by hand and its comments are documentation: no script rewrites it.

# ---------------------------------------------------------------------------
# Source — Figshare (data.dtu.dk), collection DOI 10.11583/DTU.c.6244065
# ---------------------------------------------------------------------------
source:
  collection_id: 6244065

  articles:
    # Ready-To-Train: already preprocessed, standard-scaled, NaNs handled.
    train:
      id: 21316608
      n_files: 512                 # + the PDF manual
      total_bytes: 60201065698     # 60.20 GB for the whole article
      pattern: '*_prep.nc'
    test:
      id: 21762830
      n_files: 20                  # + 20 *_reference.nc + 20 *_charts.png
      total_bytes: 2511719753
      pattern: '*_prep.nc'
      reference_pattern: '*_prep_reference.nc'   # the labels, ~790 KB each

    # DO NOT download: 260 GB, and SAR preprocessing is out of scope for this project.
    raw_train_do_not_download: 21284967
    raw_test_do_not_download: 21762848

  manual_file_id: 38640908         # AI4Arctic_challenge-dataset-manual_21.12.2022.pdf

  # Verified: no authentication. download_url is a 302 to a presigned S3 URL
  # with X-Amz-Expires=10, so the redirect must be followed immediately.
  # Range requests work but ONLY with GET: a HEAD gets 403 because the S3
  # signature is valid only for GET.
  auth_required: false
  supports_range: true
  use_head_requests: false

# ---------------------------------------------------------------------------
# Subset selection
# ---------------------------------------------------------------------------
subset:
  n_train_scenes: 60               # design target for the training subset
  download_all_test: true

  # The file name does NOT contain the region: it is <YYYYMMDD>T<HHMMSS>_<service>_prep.nc
  # and `service` is only {dmi, cis}. The region is in the HDF5 attribute
  # `original_id` at the root of the netCDF, readable with a 2 KB Range GET
  # without downloading the scene. The full map is in data/scene_regions.json.
  stratify_by: [region, month]
  region_source: data/scene_regions.json

  min_free_gb: 25                  # below this threshold the download stops with an error

# The split lives in configs/split.yaml — generated once and never regenerated.
split_file: configs/split.yaml

# ---------------------------------------------------------------------------
# netCDF variables — VERIFIED on a real scene
# ---------------------------------------------------------------------------
variables:
  # Sentinel-1 dual-pol SAR, noise-corrected (NERSC), 80 m/px.
  # Note: already standard-scaled by the dataset. On the verified scene the values
  # range from -1.9 to 2.7 — they are not dB. No further normalisation.
  sar_hh: nersc_sar_primary
  sar_hv: nersc_sar_secondary
  incidence_angle: sar_incidenceangle     # also standard-scaled, not degrees
  distance_to_land: distance_map          # optional channel (ablation)

  targets:
    sic: SIC          # concentration, 0-10 in tenths (+ 255 = ignore)
    sod: SOD          # stage of development — the project's target
    floe: FLOE        # not used: out of scope

  # WARNING — the original design notes had this name wrong.
  # They assumed `sar_grid_latitude` / `sar_grid_longitude` with separate line/
  # sample indices. The real names are these, and they are ready-made 2D grids,
  # which simplifies geocoding.
  geometry:
    latitude: sar_grid2d_latitude         # 21×21 on a 4996×5246 scene
    longitude: sar_grid2d_longitude
    grid_shape: [21, 21]
    # → needs interpolation to full resolution before reprojecting onto the routing grid

  passive_amsr2:                          # not used in the base model
    [btemp_6_9h, btemp_6_9v, btemp_7_3h, btemp_7_3v, btemp_10_7h, btemp_10_7v,
     btemp_18_7h, btemp_18_7v, btemp_23_8h, btemp_23_8v, btemp_36_5h,
     btemp_36_5v, btemp_89_0h, btemp_89_0v]

  weather_era5:                           # not used in the base model
    [u10m_rotated, v10m_rotated, t2m, skt, tcwv, tclw]

# Global attributes present in every scene, verified.
global_attrs:
  scene_id: scene_id
  original_id: original_id       # contains the region and the source S1 product
  ice_service: ice_service       # {dmi, cis}
  pixel_spacing: pixel_spacing   # 80 (metres)
  flip: flip                     # 1 on the verified scene — MUST BE HANDLED in geocode.py

fill_value: 255                  # verified: 'mask' in the toolkit's SIC/SOD/FLOE_LOOKUP

# ---------------------------------------------------------------------------
# SOD classes and mapping to POLARIS — THE CRITICAL JOINT
# ---------------------------------------------------------------------------
# The 6 SOD classes are those produced by SOD_LOOKUP in the official toolkit,
# which groups the WMO codes of the ice chart. They match the 5-6 class target
# of the original design: no further grouping is needed.
sod_classes:
  0: {name: "Open water",  wmo_codes: [0, 80]}
  1: {name: "New ice",     wmo_codes: [81, 82]}       # new ice, nilas/ring ice
  2: {name: "Young ice",   wmo_codes: [83, 84, 85]}   # young, grey, grey-white
  3: {name: "Thin FYI",    wmo_codes: [87, 88, 89]}   # thin FYI + stages 1 and 2
  4: {name: "Thick FYI",   wmo_codes: [86, 91, 93]}   # generic FYI, medium, thick
  5: {name: "Old ice",     wmo_codes: [95, 96, 97]}   # old, second year, multi-year
  255: {name: "Ignore",    wmo_codes: [98, 99]}       # glacier ice, unknown

n_classes: 6

# Mapping from SOD class to the column of data/polaris_rv.csv.
#
# Each SOD class covers several POLARIS ice types, so the choice of column is a
# decision. Rule adopted: **always take the column with the lowest RIV among
# those covered**, i.e. the most cautious one. An error in this direction
# produces a route more prudent than necessary; the opposite error sends a ship
# into ice it cannot handle.
#
# Justification per row (WMO nomenclature):
#   Young ice = 10-30 cm = grey (10-15) + grey-white (15-30). Take
#     grey_white_ice: for IB it is 1 against 2 for grey_ice.
#   Thin FYI = 30-70 cm = 1st stage (30-50) + 2nd stage (50-70). Take
#     thin_fyi_2nd_stage: for IA it is 0 against 1.
#   Thick FYI: SOD class 4 also includes medium FYI (code 91). Take
#     thick_fyi: for PC6 it is -1 against 0 for medium_fyi.
#   Old ice = second year + multi-year. Take heavy_multi_year_ice, which is
#     also the column the circular's §1.1.2 requires when it cannot be
#     determined with confidence that the multi-year ice is under 2.5 m — and
#     from a SOD chart it cannot.
sod_to_polaris:
  0: ice_free
  1: new_ice
  2: grey_white_ice
  3: thin_fyi_2nd_stage
  4: thick_fyi
  5: heavy_multi_year_ice

# ---------------------------------------------------------------------------
# Patch extraction
# ---------------------------------------------------------------------------
patches:
  size: 256
  stride: 192                      # 64 px overlap
  max_invalid_fraction: 0.30       # discard patches with >30% invalid pixels

  # Balancing: an Arctic scene is mostly open water or uniform ice. Without
  # this, the model learns to predict a single class.
  margin_fraction_target: 0.40     # at least 40% of patches contain a margin
  margin_criterion:
    min_classes: 2                 # ≥2 SOD classes in the patch...
    min_class_fraction: 0.10       # ...each with ≥10% of the valid pixels

  # HOW that 40% is obtained. See docs/decisions.md D-017.
  #
  #   discard — the excess uniform patches are thrown away. Simple, but on the
  #             first real measurement it kept 1,850 patches out of 12,594 valid
  #             ones: 14.7%. The model overfitted at mIoU 0.26 with the training
  #             loss still falling. The ratio was right and the data was not there.
  #   sampler — EVERYTHING is kept in the cache and the 40% is obtained by
  #             weighting the sampling during training. Same balance, 6.8× the
  #             data. Costs disk space (~15 GB against 2.2 GB).
  #
  # 'discard' remains available to regenerate the small cache for a comparison.
  balance: sampler

  augmentation:
    hflip: true
    vflip: true
    rot90: true
    # FORBIDDEN: arbitrary rotation (it interpolates a categorical target) and
    # colour jitter (backscatter is a physical quantity, not an aesthetic one).
    arbitrary_rotation: false
    color_jitter: false
