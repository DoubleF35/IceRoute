# Assumptions behind every number shown in the demo. This file is mandatory: it is
# the single place every economic and performance claim comes from.
#
# RULE: no invented values. Every entry has a `source:`. Where there is no source,
# `provisional: true`, and the number may NOT appear in an economic claim.
# The rule is explicit: if a figure cannot be sourced, savings are shown in TRANSIT
# HOURS — which follow from the speed model and can be defended — not in dollars.
#
# The demo footer opens this file. That is deliberate: it shows the rigour and
# answers the question "what are these numbers based on?" before it is asked.

meta:
  updated: 2026-09-05
  decisions: "docs/decisions.md D-033"

# ---------------------------------------------------------------------------
# Reference vessel
# ---------------------------------------------------------------------------
vessel:
  reference_class: PC6
  classes_shown: [PC6, PC7, IA]

  open_water_speed_kn: 12.0
  open_water_speed_source: null
  open_water_speed_provisional: true
  # P-05. No citable source found for the cruising speed of a generic PC6 in open
  # water. 12 knots is plausible for an ice-strengthened cargo ship but is NOT
  # documented.
  #
  # What depends on it and what does not:
  #   - ABSOLUTE transit HOURS scale with 1/v_open: if the true value is 14
  #     knots, every time drops by 14%;
  #   - the PERCENTAGE SAVING is robust, because numerator and denominator
  #     scale together;
  #   - whether a route is passable or not does not depend on it at all:
  #     that depends on the RIO, i.e. on POLARIS.
  # In the demo the absolute time must be labelled as depending on this assumption.

  # Speed limits under elevated risk: these DO have a source.
  elevated_speed_limits_kn:
    PC1: 11
    PC2: 8
    PC3: 5
    PC4: 5
    PC5: 5
    PC6: 3
    PC7: 3
  elevated_speed_limits_source: "IMO MSC.1/Circ.1519, Table 1.2"

  fuel_consumption_t_per_day: null
  fuel_consumption_source: null
  fuel_consumption_provisional: true
  # Without this and without the price, NO dollars are shown. See `economics`.

# ---------------------------------------------------------------------------
# Fuel — P-09
# ---------------------------------------------------------------------------
fuel:
  price_usd_per_t: null
  price_source: null
  price_date: null
  provisional: true

economics:
  # The switch that keeps an unsourced number out of any public claim.
  # The UI reads this; it does not decide on its own.
  show_dollar_savings: false
  reason: >-
    Neither daily fuel consumption nor fuel price has a citable source (P-09).
    Without a source, HOURS saved are shown, not dollars. Hours saved follow from
    the speed model and can be defended; a dollar figure without a source is a
    number that falls apart at the first question.
  show_hours_saved: true

# ---------------------------------------------------------------------------
# POLARIS — everything from the primary source
# ---------------------------------------------------------------------------
polaris:
  source: "IMO MSC.1/Circ.1519, Tables 1.1, 1.2, 1.3"
  risk_values_file: data/polaris_rv.csv
  thresholds:
    normal_operation: "RIO >= 0"
    elevated_risk: "-10 <= RIO < 0"
    special_consideration: "RIO < -10"
  thresholds_source: "IMO MSC.1/Circ.1519, Table 1.1"
  open_water_rio: 30.0
  note: >-
    The RIO always includes the open-water remainder: RIO = SIC*RIV + (10-SIC)*RIV_open.
    Leaving it out is the classic mistake and produces routes more pessimistic than reality.

# ---------------------------------------------------------------------------
# Ice classes shown — three-class fallback, see docs/decisions.md D-020
# ---------------------------------------------------------------------------
segmentation:
  scheme: "3 classes (fallback, docs/decisions.md D-020)"
  classes:
    0: {name: "Open water", polaris_type: ice_free}
    1: {name: "Thin ice",   polaris_type: thin_fyi_2nd_stage}
    2: {name: "Thick ice",  polaris_type: heavy_multi_year_ice}
  mapping_rule: >-
    Each grouped class inherits the risk value of its MOST DANGEROUS member. Checked
    that the worst member is the same for PC6, PC7 and IA; otherwise a single POLARIS
    type would not represent the group. Rounding goes towards danger, so the
    reduction cannot produce permissive errors.
  reduced_from: "6 AI4Arctic SOD classes"
  reduction_reason: >-
    The 6-class model stalled at mIoU 0.272 on the official test set against a
    threshold of 0.60, and it was confidently wrong (D-018). The fallback was
    planned in advance: below the threshold the problem is reduced, the number is
    not adjusted.
  # WARNING: numbers produced with 3 classes are not comparable with the 0.60
  # threshold, which refers to the 6 SOD classes. It is a different, easier problem.

# ---------------------------------------------------------------------------
# Grid and geodesy
# ---------------------------------------------------------------------------
grid:
  crs: "EPSG:3413"
  crs_name: "WGS 84 / NSIDC Sea Ice Polar Stereographic North"
  resolution_m: 500
  true_scale_lat: 70.0
  scale_correction: true
  scale_correction_note: >-
    Planar distances in EPSG:3413 are divided by the point scale factor computed
    by PROJ. Without the correction the error is -1.94% at 78°N and -2.83% at 85°N,
    systematic and always in the same direction. See D-010.

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
dataset:
  name: "AI4Arctic Sea Ice Challenge Dataset"
  doi: "10.11583/DTU.c.6244065"
  sensor: "Sentinel-1 EW dual-pol (HH/HV)"
  pixel_spacing_m: 80
  scenes_train: 45
  scenes_val: 10
  scenes_demo: 5
  scenes_test_official: 20
  test_set_note: >-
    The 20 test scenes are the challenge's official test set, never used for training,
    model selection or choosing the demo scenes. It is the only unbiased estimate.

# ---------------------------------------------------------------------------
# Measurements — filled from metrics.json, NEVER by hand
# ---------------------------------------------------------------------------
downlink:
  # The three figures come from the SAME scene — the one with the median compression —
  # because raw / payload must come out at exactly `ratio`. Three independent medians
  # give a quotient that is none of the printed numbers, and a reader will divide them.
  ratio_scene: "20180917T121813_cis_prep.nc" # written by iceroute.report.assumptions
  raw_scene_bytes: 64991441    # written by iceroute.report.assumptions
  payload_bytes: 147931        # written by iceroute.report.assumptions
  ratio: 439.3                 # written by iceroute.report.assumptions
  ratio_min: 281.3             # written by iceroute.report.assumptions
  ratio_max: 770.2             # written by iceroute.report.assumptions
  provisional: false           # written by iceroute.report.assumptions
  numerator_definition: >-
    SAR channels, losslessly compressed. Not the raw bytes: a real payload compresses
    before transmitting, and 7% to 58% of a scene is swath padding at 0.0.
    Comparing against uncompressed data means beating a baseline nobody would ever
    put in orbit.
  payload_definition: >-
    PREDICTED ice mask (PNG) + route (GeoJSON) + metadata. It does NOT contain the
    direct comparison route, which the satellite does not transmit (D-028).
    Mind what is inside: the mask is about 99.7% of the packet, the route alone is
    ~430 bytes. An early estimate claimed "< 4 KB, a tactical vector, not images":
    that is A-10 in docs/decisions.md, *Early estimates vs. measurements*, off by a
    factor of about 37. The number to quote is payload_bytes, and the sentence that
    goes with it must change together with the number.
  note: >-
    P-06 closed on 2026-09-07. Measured on the predicted mask, not on the ice chart:
    the chart is drawn as polygons and compresses much better than a network's
    output, so it gave 1012:1 instead of 439:1 (D-016). The original design target
    assumed 200:1.

# ---------------------------------------------------------------------------
# Link budget — A-10 in docs/decisions.md, *Early estimates vs. measurements*,
# settled on 2026-09-09
# ---------------------------------------------------------------------------
# These are NOT our measurements: they are the speeds the operators declare.
# They answer the only serious objection to the 148 KB packet ("can the ship's
# link handle it?"), and must be quoted as a third-party specification.
# The seconds are DERIVED from the peak rate: real throughput is lower, so they
# should be stated as an order of magnitude, not as a stopwatch reading.
link:
  iridium_certus_100_kbps: 88
  iridium_certus_100_source: "Iridium, Certus 100 product sheet (IP data up to 88 kbps)"
  inmarsat_fleetbroadband_kbps: 432
  inmarsat_fleetbroadband_source: "Inmarsat FleetBroadband, up to 432 kbps"
  iridium_sbd_message_bytes: 300
  iridium_sbd_source: "Iridium Short Burst Data, messages up to ~300 bytes"
  note: >-
    The full packet (148 KB) takes about 13 s at 88 kbps and about 3 s at 432 kbps.
    The route alone (~430 bytes) fits in TWO SBD messages, i.e. in the cheapest and
    most widespread maritime data channel there is. FleetBroadband already delivers
    real-time ECDIS updates as an ordinary service: 148 KB of ice layer is exactly
    the kind of traffic that link is designed for.

model:
  parameters: 1964131          # written by iceroute.report.assumptions
  onnx_int8_bytes: 2148589     # written by iceroute.report.assumptions
  latency_ms_per_tile: 39.744  # written by iceroute.report.assumptions
  int8_degradation: 0.0046     # written by iceroute.report.assumptions
  provisional: false           # written by iceroute.report.assumptions
  latency_note: >-
    Measured on 1 thread. The laptop has 22 cores, the payload does not: quoting
    the 22-thread number for an FPGA target would mean nothing.
  size_note: >-
    An early estimate put the model at 58 KB (A-02 in docs/decisions.md, *Early
    estimates vs. measurements*). That would imply about 59,000 parameters, against
    the almost two million actually there: it was arithmetically impossible.
    For a useful comparison: CloudScout, the model ESA actually flew on PhiSat-1
    in 2020, took 2.1 MB.
  degradation_note: >-
    This is the DIFFERENCE between fp32 and INT8, measured on the same scenes
    through exactly the same tiling code. Only the difference can be quoted: the
    absolute mIoU values of that check run on training scenes the model has already
    seen. The real quality is mIoU 0.532 on the official test set. The early
    estimate was "1–3% mIoU lost to INT8" (A-04): the measured drop is lower, i.e.
    better than estimated.
