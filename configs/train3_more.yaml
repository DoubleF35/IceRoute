# Experiment: 3 classes + MORE SCENES. Baseline: configs/train3.yaml.
#
# The only difference from the baseline: use_split_extra. The 90 additional
# scenes extend ONLY train; val and demo stay identical to the frozen split,
# otherwise the before/after comparison would not isolate the effect of the data.
#
# Why: the baseline stopped with training loss 0.22 against validation 0.77 and
# 10 epochs without improvement. That signature is overfitting, i.e. a lack of
# data — not the shape of the loss.
#
# REDUCED 3-CLASS SCHEME (fallback, docs/decisions.md D-020).
#
# The 6-class model stalled at mIoU 0.272 on the official test set, against
# a threshold of 0.60, and it was confidently wrong (D-018). This file trains
# the reduced scheme: open water / thin ice / thick ice.
#
# The numbers produced here are NOT comparable with the 6-class ones.
#
# No value here is a guess: each one either comes from the original design
# plan or is forced by the 6 GB of VRAM on the RTX 4050. Where I made the
# choice myself, the reason is given.

seed: 1337                      # fixed and logged: two runs must match

# ---------------------------------------------------------------------------
# Model — the keys match UNetConfig in model/unet.py
# ---------------------------------------------------------------------------
model:
  in_channels: 3                # hv, hh, incidence_angle
  n_classes: 3                  # three-class fallback, see docs/decisions.md D-020
  encoder_channels: [16, 32, 64, 128]
  bottleneck_channels: 256
  groups: 8
  # Count measured with this configuration: 1,964,182 parameters.
  # Parameter budget: < 2,000,000. Margin: 35,818. See docs/decisions.md D-005.
  # Adding the distance_to_land channel (in_channels: 4) raises the count by
  # only 144: the budget holds.

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  patch_size: 256
  cache_dir: data/processed

  # Patches on disk stay at 6 classes: the collapse happens on read, so
  # changing scheme does not cost a new 15 GB extraction.
  collapse_classes: true

  # Adds configs/split_extra.yaml to the training split only.
  use_split_extra: true
  num_workers: 8                # 22 cores available; 8 already saturates NVMe I/O
  pin_memory: true

# ---------------------------------------------------------------------------
# Optimisation
# ---------------------------------------------------------------------------
train:
  batch_size: 16                # On OOM, drop to 8 AND LOG IT
  epochs: 60
  amp: true                     # mandatory: without it, 6 GB is not enough
  amp_dtype: fp16

  optimizer:
    name: adamw
    lr: 3.0e-4
    weight_decay: 1.0e-4

  scheduler:
    name: cosine
    warmup_steps: 500

  early_stopping:
    monitor: val_miou
    mode: max
    patience: 10

  grad_clip_norm: 1.0           # not in the original plan: small network + AMP fp16,
                                # clipping costs nothing and stops a single degenerate
                                # batch from sending an hours-long run to NaN

# ---------------------------------------------------------------------------
# Loss — CrossEntropy with ignore_index + Dice over the valid classes
# ---------------------------------------------------------------------------
loss:
  ce_weight: 1.0
  dice_weight: 0.5
  ignore_index: 255             # AI4Arctic convention: 255 = pixel to ignore
                                # TO BE VERIFIED with inspect.py (P-01)

  # Class weights inversely proportional to frequency. The old-ice classes are
  # rare, and they are exactly the ones routing makes its decisions on: without
  # weights the model learns never to predict them and the mIoU stays high anyway.
  class_weights:
    mode: inverse_frequency
    # Computed from artifacts/data_stats.json, not written by hand.
    normalize: true
    clip_max: 10.0              # without a cap, a class at 0.01% would get
                                # weight 10,000 and dominate the gradient

# ---------------------------------------------------------------------------
# Checkpoints and logging
# ---------------------------------------------------------------------------
output:
  checkpoint_dir: artifacts/models
  best_checkpoint: artifacts/models/unet3more_fp32.pt
  log_csv: artifacts/logs/train3more_log.csv    # CSV, not wandb: the demo must
                                           # work with the network off
  onnx_fp32: artifacts/models/unet3more_fp32.onnx
  onnx_int8: artifacts/models/unet3more_int8.onnx

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
eval:
  tile_size: 256
  tile_overlap: 32              # whole-scene inference with blending
  batch_size: 8

  # Minimum acceptable thresholds for the demo. Below them the problem is
  # reduced (to binary), the number is not adjusted.
  # WARNING: 0.60 is the threshold for the SIX SOD classes. Here the problem
  # has THREE classes and is easier: an mIoU above 0.60 with this scheme does
  # NOT show that that threshold has been met. See D-020.
  min_miou: 0.60
  min_binary_accuracy: 0.90

quantize:
  calibration_patches: 200
  method: minmax
  per_channel: true
  # If the degradation exceeds 3 mIoU points, the plan allows QAT with Brevitas
  # as an option off the critical path. Measure first, then decide.
  max_acceptable_miou_drop: 0.03
  latency_runs: 10
