# Demo scenes. See docs/decisions.md D-022.
#
# They do NOT come from the frozen split: they come from the **official AI4Arctic
# test set**, 20 scenes the model has never seen and that were not used to select
# it. That is a stronger position than the original plan of hand-picking demo
# scenes from the frozen split, not a weaker one: showing a scene the model was
# trained on is the first thing any technical reviewer asks to rule out.
#
# The labels of these scenes are in sibling `_prep_reference.nc` files;
# `precompute` finds them on its own by looking on disk.

source_dir: data/raw/test

# Selection criteria, applied to the numbers and not by eye (D-021):
#   1. the direct route must be forbidden BY THE ICE for all three vessel
#      classes — not out of coverage, which is a different thing (D-011);
#   2. high ice-chart coverage, otherwise the comparison with the baseline
#      cannot be defended;
#   3. where possible, the route must CHANGE with the vessel class;
#   4. the model must not perform badly on the scene — added on 2026-09-06, see
#      D-024. Criteria 1-3 look at the ICE, and on their own they had let into
#      the carousel the scene the model gets most wrong out of all twenty. The
#      deciding number is the permissive fraction, not the mIoU: it is the
#      fraction of pixels that would send the ship into forbidden ice.
#
# Criteria 1-3 are computed on the ice chart (`precompute --use-chart`), i.e. on
# the properties of the ice and not on a model still in training. Criterion 4
# comes from `artifacts/metrics.json`, on the official test set.

scenes:
  # --- the opening scene ----------------------------------------------------
  - id: 20180707T113313_cis_prep.nc
    coverage: 0.57
    routes_differ: true
    n_no_go_cells: 352
    why: >-
      The strongest of the batch: 352 cells forbidden by the ice and the route
      changes with the vessel class. Both key points of the demo on one scene.

  - id: 20180917T121813_cis_prep.nc
    coverage: 0.66
    routes_differ: true
    n_no_go_cells: 128
    why: High coverage and a route that changes with the class.

  - id: 20200701T114012_cis_prep.nc
    coverage: 0.52
    routes_differ: true
    n_no_go_cells: 81
    why: Third scene in which the class selector does something real.

  # --- the two with very high coverage --------------------------------------
  - id: 20201013T080448_dmi_prep.nc
    coverage: 0.8124
    routes_differ: true
    n_no_go_cells: 14
    miou: 0.5723
    worst_unsafe_fraction: 0.0238
    why: >-
      Replaces 20180623 (D-024). Keeps the role of the high-coverage scene —
      81%, the highest among the candidates — and in addition makes the route
      change with the vessel class, which the outgoing scene did not.
      LIMITATION, stated: here criterion 1 holds only in part. The direct route
      is passable for PC6 and PC7 (0 forbidden cells, IceRoute costs +1%), and
      is forbidden only for IA, 14 cells. The point "the straight line cannot
      be sailed" is carried by the first three scenes; this one carries the
      point "change the class and the answer changes", on a chart with 81%
      coverage.

  - id: 20210506T075557_dmi_prep.nc
    coverage: 0.81
    routes_differ: false
    n_no_go_cells: 344
    why: >-
      344 forbidden cells at 81% coverage. The scene in which the ice is
      visibly the main subject.

# The scene the model gets most wrong, kept ON PURPOSE and labelled as such.
# It is not in the carousel: `precompute` generates it together with the others
# and the UI shows it at the end with a warning. It exists because "and when is
# it wrong?" is the question every technical reviewer asks, and having the answer
# ready is worth more than hoping nobody asks. See D-024.
worst_case:
  id: 20180623T114935_cis_prep.nc
  coverage: 0.9477
  routes_differ: false
  n_no_go_cells: 100
  miou: 0.2527
  worst_unsafe_fraction: 0.5172
  why: >-
    Worst of the 20 official test scenes by mIoU (0.25 against 0.54 aggregate)
    and by permissive fraction (51.7%: on more than half of the pixels the model
    declares passable ice that POLARIS forbids to that class). In the worst case
    it overestimates the RIO by 80 points.
    It was in the carousel until 2026-09-06 because it was chosen on criteria 1-3 alone.

# The 5 demo scenes of the frozen split are NO LONGER used. Reason, from D-021:
# only one made the route change (and by 3 cells, at 12% coverage), and
# `20180108T184332` was unusable because the geodesic left the chart for every
# class. They stay in the split: the file is never regenerated.
superseded:
  - 20180108T184332_dmi_prep.nc   # unusable: geodesic outside coverage
  - 20180806T184330_dmi_prep.nc
  - 20200919T161650_cis_prep.nc
  - 20210118T075356_dmi_prep.nc
  - 20210408T082835_dmi_prep.nc
