# Geocoding, POLARIS, speed model and A*.
#
# READ BEFORE TOUCHING THE NUMBERS
# --------------------------------
# Every value below is tagged with where it comes from:
#
#   [IMO]          taken from MSC.1/Circ.1519. Do not change without re-reading the circular.
#   [MEASURED]     produced by a script in this repository.
#   [CHOICE]       implementation parameter, not a physical quantity.
#   [PROVISIONAL]  HAS NO SOURCE. It may not appear in any public claim until it has one.
#                  Listed in docs/decisions.md, *Provisional values*, and flagged by the UI.

# ---------------------------------------------------------------------------
# Grid
# ---------------------------------------------------------------------------
grid:
  crs: "EPSG:3413"          # [CHOICE] WGS84 / NSIDC Polar Stereographic North,
                            # the standard for Arctic sea ice
  resolution_m: 500         # [CHOICE] The native 80 m is useless for routing
                            # and makes A* extremely slow.

  # EPSG:3413 is true to scale only at 70°N. At Arctic latitudes a planar distance
  # underestimates the real one by up to 2.8%. See docs/decisions.md D-010.
  # Turning this off makes tests/test_geocode.py fail, on purpose.
  apply_scale_factor: true  # [CHOICE] not optional in practice

# ---------------------------------------------------------------------------
# Vessel
# ---------------------------------------------------------------------------
vessel:
  # Classes shown in the demo: at least PC6, PC7 and one non-PC ice-strengthened
  # class, because changing the class has to change the route visibly.
  classes: [PC6, PC7, IA]   # [CHOICE]
  default_class: PC6

  # ─── THE ONLY UNSOURCED NUMBER IN THIS FILE ──────────────────────────────
  # Open-water speed. Used to convert distances into times.
  #
  # The IMO circular sets the limits under elevated risk (Table 1.2, below) but
  # NOT the open-water speed, which depends on the ship and not on the
  # regulation. I found no citable source for a typical PC6.
  #
  # Consequences, to be respected:
  #   · the PERCENTAGE SAVING is robust: v_open almost entirely cancels out in
  #     the ratio between the two routes;
  #   · ABSOLUTE HOURS scale with 1/v_open and must be shown with the
  #     assumption stated on screen;
  #   · no dollars without a source. Hours are shown instead.
  open_water_speed_kn: 12.0   # [PROVISIONAL] see docs/decisions.md P-05

# ---------------------------------------------------------------------------
# Speed model — from RIO to knots
# ---------------------------------------------------------------------------
speed_model:
  # Three bands, matching the three levels of operation of the circular,
  # §1.3.2. It is not an invented curve: it is the regulation made executable.
  #
  #   RIO >= 0         normal operation          → full speed
  #   -10 <= RIO < 0   elevated risk             → Table 1.2 limit [IMO]
  #                                                 (Polar Class only; below PC7
  #                                                  this band is already no-go)
  #   RIO < -10        special consideration     → impassable cell
  #
  # Limits in knots, Table 1.2 of the circular. [IMO]
  elevated_speed_limit_kn:
    PC1: 11.0
    PC2: 8.0
    PC3: 5.0
    PC4: 5.0
    PC5: 5.0
    PC6: 3.0        # the table says "Below PC5"
    PC7: 3.0

  # Interpolation inside the elevated-risk band. The circular gives a limit,
  # not a profile: 'step' applies the flat limit across the whole band
  # (literal reading), 'linear' degrades from v_open to the limit as RIO goes
  # from 0 to -10.
  # 'step' is used: it is what the circular says. 'linear' is more realistic but
  # it is our own invention and would produce times that cannot be defended.
  band_profile: step        # [CHOICE] literal with respect to the regulation

# ---------------------------------------------------------------------------
# A*
# ---------------------------------------------------------------------------
astar:
  # 16-connected, not 8. On an 8-connected grid the optimal path overestimates
  # the true length by about 8% on diagonals (digitisation error), and on a
  # demo that shows a percentage saving that 8% is larger than the effect being
  # shown.
  connectivity: 16          # [CHOICE] justified above

  # Heuristic: Euclidean distance on the projected grid divided by v_open.
  # Admissible by construction, because no cell can be crossed faster than
  # v_open. A value > 1.0 makes it inadmissible and the path is no longer
  # optimal: you gain speed and lose the guarantee.
  heuristic_weight: 1.0     # [CHOICE] do not raise without declaring it

  # Safety margin from the coast. A route that grazes the land is technically
  # optimal and nautically absurd.
  land_buffer_cells: 2      # [CHOICE]

  max_expansions: 20000000  # [CHOICE] guard against a runaway search on a large grid

  # Straightening (string pulling) after A*. On a grid, even a 16-connected
  # one, a leg that should run at 20° is built from steps at 0°, 26.6° and
  # 45°: the route zigzags in open water and is slower than it needs to be.
  # The pass replaces a leg with the straight line only if every cell it
  # crosses is passable, if it does NOT lower the minimum RIO of the replaced
  # leg, and if it really is faster. See docs/decisions.md D-040.
  straighten: true          # [CHOICE]

# ---------------------------------------------------------------------------
# Demo waypoints
# ---------------------------------------------------------------------------
# [PROVISIONAL] To be fixed once the 5 demo scenes are chosen by hand: the
# waypoints must fall inside the scene and on navigable water. See P-07.
waypoints: {}

# ---------------------------------------------------------------------------
# Route simplification
# ---------------------------------------------------------------------------
simplify:
  max_waypoints: 40         # [CHOICE]
  tolerance_m: 2000         # [CHOICE] Douglas-Peucker; 4 cells at 500 m
  max_turn_deg: 60          # [CHOICE] turn beyond which a leg is flagged
                            # as unrealistic

# ---------------------------------------------------------------------------
# Comparison baseline
# ---------------------------------------------------------------------------
baseline:
  # Geodesic route between the same two waypoints, with only the land mask
  # applied, ignoring the ice. It is the honest comparison: "what a ship with
  # only a nautical chart would do".
  mode: geodesic            # [CHOICE]
  # The baseline sails at v_open everywhere except where the ice would stop it:
  # if it crosses no-go cells, the time is undefined and this is declared.
  report_infeasible: true
