[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iceroute"
version = "1.0.0"
description = "On-board sea-ice segmentation from Sentinel-1 SAR and POLARIS-constrained Arctic route optimisation, sized for a CubeSat"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Fassio" }]
keywords = [
    "sea-ice", "sar", "sentinel-1", "semantic-segmentation", "u-net", "onnx",
    "int8-quantization", "edge-ai", "cubesat", "arctic", "route-planning", "polaris",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Real dependencies live in requirements.txt (exact pins, compiled from
# requirements.in). The package itself declares none and is installed with
# `pip install -e . --no-deps`, so the resolver never gets a chance to change
# a version that a measured number depends on.
dependencies = []

[project.scripts]
iceroute = "iceroute.cli:main"

[project.urls]
Repository = "https://github.com/DoubleF35/IceRoute"
Documentation = "https://github.com/DoubleF35/IceRoute/tree/main/docs"
"Decision log" = "https://github.com/DoubleF35/IceRoute/blob/main/docs/decisions.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: needs downloaded data or a training run (deselect with -m 'not slow')",
    "needs_data: needs scenes in data/raw/",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # call in default argument: used on purpose in a few config dataclasses
]
